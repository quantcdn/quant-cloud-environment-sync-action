name: 'Quant Cloud Environment Sync'
description: 'Syncs data between environments in Quant Cloud'
branding:
  icon: 'cloud'
  color: 'blue'
inputs:
  api_key:
    description: 'Quant API key'
    required: true
  organization:
    description: 'Quant organisation ID'
    required: true
  app_name:
    description: 'Name of your application'
    required: true
  environment_name:
    description: 'Name for the environment'
    required: true
  base_url:
    description: 'Quant Cloud API URL'
    required: false
    default: 'https://dashboard.quantcdn.io'
  source:
    description: 'Name of the source environment'
    required: true
  wait:
    description: 'Whether to wait for the sync to complete'
    required: false
    default: 'false'
  wait_interval:
    description: 'Interval in seconds to wait for the sync to complete'
    required: false
    default: '10'
  max_retries:
    description: 'Maximum number of retries before timing out'
    required: false
    default: '30'
  type:
    description: 'Type of data to sync'
    required: false
    default: 'database'
  fail_on_skip:
    description: 'Fail the step when the API refuses the sync with HTTP 400 (for example the database is not configured). When false, the step passes with a warning and skipped=true.'
    required: false
    default: 'false'
outputs:
  sync_id:
    description: 'ID of the sync'
  success:
    description: 'Whether the sync was successful'
    value: true
  skipped:
    description: 'Whether the sync was skipped because the API refused it (HTTP 400, e.g. database not configured). A warning annotation explains why.'
runs:
  using: 'node24'
  main: 'dist/index.js' 